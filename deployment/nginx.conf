server {
    listen 80;
    server_name localhost;

    # Serve Vite React frontend static assets
    location / {
        root /home/obsidian/Documents/SIFBACKUPBACKENDV1/SIF (copy 1)/SifEngine/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API endpoints to FastAPI Uvicorn backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct proxy for OpenAPI docs & Swagger UI
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
